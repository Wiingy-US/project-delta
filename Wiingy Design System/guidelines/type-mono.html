<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-primary); background: #fff; }
  .specimens { padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .meta { width: 160px; flex-shrink: 0; }
  .meta .name { font-size: 11px; font-weight: 600; color: var(--grey-3); font-family: var(--font-mono); }
  .sample { font-family: var(--font-mono); color: var(--text-primary); }
</style>
</head>
<body>
<div class="specimens">
  <div class="row">
    <div class="meta"><span class="name">IBM Plex Mono</span></div>
    <span class="sample" style="font-size: 14px; line-height: 20px;">const tutor = await findTutor({ subject: "calculus" });</span>
  </div>
</div>
</body>
</html>
