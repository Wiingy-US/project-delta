<!-- @dsCard group="Spacing" viewport="700x200" name="Elevation" subtitle="Shadow tokens from none to highest" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-primary); background: var(--grey-7); }
  .row { display: flex; gap: 20px; padding: 24px; align-items: center; }
  .card { width: 96px; height: 96px; background: #fff; border-radius: var(--radius-lg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .label { font-size: 10px; font-weight: 600; color: var(--grey-3); font-family: var(--font-mono); }
  .val { font-size: 9px; color: var(--grey-4); font-family: var(--font-mono); text-align: center; max-width: 80px; }
</style>
</head>
<body>
<div class="row">
  <div class="card" style="box-shadow: var(--shadow-none); border: 1px solid var(--grey-6);"><span class="label">none</span><span class="val">flat</span></div>
  <div class="card" style="box-shadow: var(--shadow-default);"><span class="label">default</span><span class="val">2px 8px</span></div>
  <div class="card" style="box-shadow: var(--shadow-mid);"><span class="label">mid</span><span class="val">4px 12px</span></div>
  <div class="card" style="box-shadow: var(--shadow-high);"><span class="label">high</span><span class="val">6px 20px</span></div>
  <div class="card" style="box-shadow: var(--shadow-highest);"><span class="label">highest</span><span class="val">8px 28px</span></div>
</div>
</body>
</html>
