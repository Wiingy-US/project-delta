<!-- @dsCard group="Spacing" viewport="700x140" name="Corner Radii" subtitle="4px small — 8px medium — 12px large — pill" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-primary); background: #fff; }
  .row { display: flex; gap: 24px; padding: 20px 24px; align-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 64px; height: 64px; background: var(--blue-100); border: 2px solid var(--blue-600); }
  .label { font-size: 11px; font-weight: 600; color: var(--grey-3); font-family: var(--font-mono); }
  .val { font-size: 10px; color: var(--grey-4); font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="box" style="border-radius: var(--radius-sm);"></div><span class="label">sm</span><span class="val">4px</span></div>
  <div class="item"><div class="box" style="border-radius: var(--radius-md);"></div><span class="label">md</span><span class="val">8px</span></div>
  <div class="item"><div class="box" style="border-radius: var(--radius-lg);"></div><span class="label">lg</span><span class="val">12px</span></div>
  <div class="item"><div class="box" style="border-radius: var(--radius-xl);"></div><span class="label">xl</span><span class="val">16px</span></div>
  <div class="item"><div class="box" style="border-radius: var(--radius-pill);"></div><span class="label">pill</span><span class="val">9999px</span></div>
</div>
</body>
</html>
