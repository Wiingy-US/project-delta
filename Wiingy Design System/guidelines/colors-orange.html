<!-- @dsCard group="Colors" viewport="700x180" name="Orange Scale" subtitle="Used for warnings and warm accents" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-primary); background: #fff; }
  .row { display: flex; gap: 6px; padding: 16px; }
  .swatch { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .swatch .color { width: 100%; height: 64px; border-radius: var(--radius-md); }
  .swatch .label { font-size: 11px; font-weight: 500; color: var(--grey-3); font-family: var(--font-mono); }
  .swatch .hex { font-size: 10px; color: var(--grey-4); font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="row">
  <div class="swatch"><div class="color" style="background: var(--orange-100);"></div><span class="label">100</span><span class="hex">#FFF7ED</span></div>
  <div class="swatch"><div class="color" style="background: var(--orange-200);"></div><span class="label">200</span><span class="hex">#FFEDD5</span></div>
  <div class="swatch"><div class="color" style="background: var(--orange-300);"></div><span class="label">300</span><span class="hex">#FED7AA</span></div>
  <div class="swatch"><div class="color" style="background: var(--orange-400);"></div><span class="label">400</span><span class="hex">#FDBA74</span></div>
  <div class="swatch"><div class="color" style="background: var(--orange-500);"></div><span class="label">500</span><span class="hex">#FB923C</span></div>
  <div class="swatch"><div class="color" style="background: var(--orange-600);"></div><span class="label">600</span><span class="hex">#F97316</span></div>
  <div class="swatch"><div class="color" style="background: var(--orange-700);"></div><span class="label">700</span><span class="hex">#EA580C</span></div>
  <div class="swatch"><div class="color" style="background: var(--orange-800);"></div><span class="label">800</span><span class="hex">#C2410C</span></div>
  <div class="swatch"><div class="color" style="background: var(--orange-900);"></div><span class="label">900</span><span class="hex">#9A3412</span></div>
  <div class="swatch"><div class="color" style="background: var(--orange-1000);"></div><span class="label">1000</span><span class="hex">#7C2D12</span></div>
</div>
</body>
</html>
