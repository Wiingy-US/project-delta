<!-- @dsCard group="Colors" viewport="700x180" name="Purple Scale" subtitle="Accent palette for highlights and tags" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-primary); background: #fff; }
  .row { display: flex; gap: 6px; padding: 16px; }
  .swatch { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .swatch .color { width: 100%; height: 64px; border-radius: var(--radius-md); }
  .swatch .label { font-size: 11px; font-weight: 500; color: var(--grey-3); font-family: var(--font-mono); }
  .swatch .hex { font-size: 10px; color: var(--grey-4); font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="row">
  <div class="swatch"><div class="color" style="background: var(--purple-50);"></div><span class="label">50</span><span class="hex">#FAF5FF</span></div>
  <div class="swatch"><div class="color" style="background: var(--purple-100);"></div><span class="label">100</span><span class="hex">#F3E8FF</span></div>
  <div class="swatch"><div class="color" style="background: var(--purple-200);"></div><span class="label">200</span><span class="hex">#E9D5FF</span></div>
  <div class="swatch"><div class="color" style="background: var(--purple-300);"></div><span class="label">300</span><span class="hex">#D8B4FE</span></div>
  <div class="swatch"><div class="color" style="background: var(--purple-400);"></div><span class="label">400</span><span class="hex">#C084FC</span></div>
  <div class="swatch"><div class="color" style="background: var(--purple-500);"></div><span class="label">500</span><span class="hex">#A855F7</span></div>
  <div class="swatch"><div class="color" style="background: var(--purple-600);"></div><span class="label">600</span><span class="hex">#9333EA</span></div>
  <div class="swatch"><div class="color" style="background: var(--purple-700);"></div><span class="label">700</span><span class="hex">#7E22CE</span></div>
  <div class="swatch"><div class="color" style="background: var(--purple-800);"></div><span class="label">800</span><span class="hex">#6B21A8</span></div>
  <div class="swatch"><div class="color" style="background: var(--purple-900);"></div><span class="label">900</span><span class="hex">#581C87</span></div>
</div>
</body>
</html>
