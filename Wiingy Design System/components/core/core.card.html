<!-- @dsCard group="Components" viewport="700x400" name="Buttons" subtitle="Primary, Secondary, Tertiary, Quaternary — two sizes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body { margin: 0; font-family: var(--font-primary); background: #fff; }
  #root { padding: 20px 24px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const _DS = window.WiingyDesignSystem_d9960c || {};
  const { Button, Tag, Badge } = _DS;

  if (!Button) { document.getElementById('root').innerHTML = '<p style="padding:24px;color:#6A6A6A;font-family:var(--font-primary)">DS bundle not yet compiled — run check_design_system to trigger a build.</p>'; }
  if (!Button) { throw new Error('DS bundle not loaded'); }

  function App() {
    return (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
        {/* Size lg */}
        <div>
          <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--grey-3)', fontFamily: 'var(--font-mono)', marginBottom: 10 }}>Size: lg (48px)</div>
          <div style={{ display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>
            <Button variant="primary">Primary</Button>
            <Button variant="secondary">Secondary</Button>
            <Button variant="tertiary">Tertiary</Button>
            <Button variant="quaternary">Quaternary</Button>
            <Button variant="primary" disabled>Disabled</Button>
          </div>
        </div>
        {/* Size sm */}
        <div>
          <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--grey-3)', fontFamily: 'var(--font-mono)', marginBottom: 10 }}>Size: sm (34px)</div>
          <div style={{ display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>
            <Button variant="primary" size="sm">Primary</Button>
            <Button variant="secondary" size="sm">Secondary</Button>
            <Button variant="tertiary" size="sm">Tertiary</Button>
            <Button variant="quaternary" size="sm">Quaternary</Button>
            <Button variant="primary" size="sm" disabled>Disabled</Button>
          </div>
        </div>
        {/* Tags */}
        <div>
          <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--grey-3)', fontFamily: 'var(--font-mono)', marginBottom: 10 }}>Tags</div>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
            <Tag>Student favorite</Tag>
            <Tag variant="success">Super tutor</Tag>
            <Tag variant="warning">Positive nudge</Tag>
            <Tag variant="accent">Highlight</Tag>
            <Tag variant="brand">Math</Tag>
            <Tag size="sm">Small tag</Tag>
          </div>
        </div>
        {/* Badges */}
        <div>
          <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--grey-3)', fontFamily: 'var(--font-mono)', marginBottom: 10 }}>Badges</div>
          <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
            <Badge variant="brand" />
            <Badge variant="success" />
            <Badge variant="warning" />
            <Badge variant="accent" />
            <Badge variant="default" />
            <span style={{ width: 1, height: 16, background: 'var(--grey-5)' }}></span>
            <Badge variant="brand">3</Badge>
            <Badge variant="success">12</Badge>
            <Badge variant="warning">!</Badge>
          </div>
        </div>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
