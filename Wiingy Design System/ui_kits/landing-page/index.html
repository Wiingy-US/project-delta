const _DS = window.WiingyDesignSystem_d9960c || {};

function Button({ children, variant = 'primary', size = 'lg', disabled, fullWidth, onClick, style, ...rest }) {
  if (_DS.Button) return React.createElement(_DS.Button, { variant, size, disabled, fullWidth, onClick, style, ...rest }, children);
  const isLg = size === 'lg';
  const variants = {
    primary:    { background: '#2655A3', color: '#fff', border: 'none' },
    secondary:  { background: '#222', color: '#fff', border: 'none' },
    tertiary:   { background: 'transparent', color: '#222', border: '1px solid #222' },
    quaternary: { background: '#fff', color: '#222', border: '1px solid #222' },
  };
  const v = variants[variant] || variants.primary;
  return (
    <button onClick={onClick} disabled={disabled} style={{
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
      height: isLg ? 48 : 34, padding: `${isLg ? 14 : 7}px 24px`, borderRadius: 8,
      border: v.border, background: v.background, color: v.color,
      fontFamily: 'var(--font-primary)', fontWeight: 500, fontSize: 16, lineHeight: '20px',
      cursor: disabled ? 'not-allowed' : 'pointer', opacity: disabled ? 0.4 : 1,
      width: fullWidth ? '100%' : 'auto', boxSizing: 'border-box', whiteSpace: 'nowrap',
      ...style
    }} {...rest}>{children}</button>
  );
}

function Tag({ children = 'Student favorite', size = 'md', variant = 'default', style, ...rest }) {
  if (_DS.Tag) return React.createElement(_DS.Tag, { size, variant, style, ...rest }, children);
  const isSm = size === 'sm';
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', padding: isSm ? '2px 8px' : '4px 10px',
      borderRadius: 9999, background: 'linear-gradient(12.78deg, #F1F1F1 3.63%, #FFF 13.83%, #FFF 68.55%, #EFEFEF 90.81%)',
      boxShadow: '0 0 0 1px #fff, 0px 4px 10px 0px rgba(0,0,0,0.16)',

      lineHeight: isSm ? '14px' : '16px', color: '#222', whiteSpace: 'nowrap', ...style
    }} {...rest}>{children}</span>
  );
}

function Badge({ children, variant = 'default', style, ...rest }) {
  if (_DS.Badge) return React.createElement(_DS.Badge, { variant, style, ...rest }, children);
  const colors = { default: '#DDD', brand: '#2655A3', success: '#219653', warning: '#FBBF24', accent: '#A855F7' };
  const isCount = children != null;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
      minWidth: isCount ? 20 : 8, height: isCount ? 20 : 8, padding: isCount ? '0 6px' : 0,

      color: variant === 'warning' ? '#92400E' : '#fff',
      fontFamily: 'var(--font-primary)', fontWeight: 700, fontSize: 11, ...style

  );
}

}

/* ─── Hero ─── */

      <div style={{ position: 'relative', zIndex: 2, width: 420, borderRadius: 'var(--radius-lg)', background: '#fff', boxShadow: 'inset 0 0 0 1px rgba(0,0,0,0.04), 0px 6px 20px rgba(0,0,0,0.2)', padding: 32, display: 'flex', flexDirection: 'column', gap: 16, marginRight: -100 }}>

/* ─── Stats ─── */

  const stats = [

    { label: 'Active Tutors', value: '1,200+', desc: 'Certified math experts' },

function TutorCard({ name, specialty, rating, reviews, bio, tag }) {
  const [hovered, setHovered] = React.useState(false);
  return (
    <div

      onMouseLeave={() => setHovered(false)}

/* ─── Trust Builder ─── */

  return (

            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ─── FAQ ─── */

  ];
  const [openIdx, setOpenIdx] = React.useState(0);
  return (
    <section style={{ padding: '40px 80px 80px' }}>
      <h2 style={{ fontSize: 'var(--heading-sm-size)', lineHeight: 'var(--heading-sm-line)', fontWeight: 'var(--heading-sm-weight)', marginBottom: 24 }}>Frequently Asked Questions</h2>
      <div style={{ display: 'flex', flexDirection: 'column' }}>
        {faqs.map((faq, i) => (
          <div key={i} style={{ borderBottom: '1px solid var(--grey-6)' }}>
            <div
              onClick={() => setOpenIdx(openIdx === i ? -1 : i)}
              style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '20px 0', cursor: 'pointer' }}
            >
              <span style={{ fontSize: 18, fontWeight: 500 }}>{faq.q}</span>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--grey-1)" strokeWidth="2" style={{ transform: openIdx === i ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 200ms', flexShrink: 0, marginLeft: 16 }}>

                {faq.a}
              </div>

          </div>
        ))}
      </div>
    </section>
  );
}
